services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-dtn_database}"
      MYSQL_USER: "${DB_USERNAME:-dtn_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-dtn_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-dtn_root_password}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:80"
    environment:
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8000}"
      APP_KEY: "${APP_KEY:-}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-dtn_database}"
      DB_USERNAME: "${DB_USERNAME:-dtn_user}"
      DB_PASSWORD: "${DB_PASSWORD:-dtn_password}"
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - app_data:/var/lib/laravel
      - storage_data:/var/www/html/storage

volumes:
  mysql_data:
  app_data:
  storage_data:
